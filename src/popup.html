<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KnightsBetterUI</title>
  <link href="css/vendor/bootstrap.min.css" rel="stylesheet">
  <script src="scripts/browser-polyfill.min.js"></script>
  <script src="scripts/jquery.min.js"></script>
  <script src="scripts/calendar_export_page.js"></script>
  <script src="scripts/popup.js"></script>
  <style>
  body {
    background-color: #f4f4f4;    
  }
  
  .toggle_container {
    text-align: left;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 10px;
    background: white;
    margin: 5px 0px;
    border-radius: 10px;
  }
  
  .container {
    width: 300px;
    margin: 10px;
    padding: 0px;
  }
  
  .custom-header {
    font-size: 1.5rem;
    color: black;
  }
  
  .header {
    display: flex;
    flex-direction: row;
    padding: 5px;
    height: 50px;
  }
  
  #logoImg {
    height: 35px;
    align-self: center;
    margin-right: 5px;
  }
  
  .header h1 {
    font-size: 1.5rem;
    position: relative;
    top: 5px;
  }
  
  .about_container {
    text-align: left;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 10px;
    background: white;
    margin: 10px 0px;
    margin-top: 10px;
    border-radius: 10px;
  }
  
  #disabled_site_separator {
    height: 1px;
    background-color: #f4f4f4;
    opacity: 0.5;
    margin: 0px;
    width: 100%;
  }
  
  .custom-paragraph {
    margin-top: 10px;
    text-align: center;
    font-size: 14px;
  }

  .credits {
    text-align: center;
    font-size: 12px;
    margin: 10px 0;
    color: #555;
  }

  .credits a {
    color: #007bff;
    text-decoration: none;
  }

  .credits a:hover {
    text-decoration: underline;
  }

  .export_container {
    text-align: left;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: stretch;
    padding: 10px;
    background: white;
    margin: 5px 0px;
    border-radius: 10px;
  }

  #popupCalendarExport {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid #ab5b1a;
    border-radius: 6px;
    background: #ab5b1a;
    color: #ffffff;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }

  #popupCalendarExport:disabled {
    border-color: #c9c9c9;
    background: #e9e9e9;
    color: #777777;
    cursor: not-allowed;
  }

  #popupCalendarExportHint {
    margin-top: 8px;
    text-align: center;
    font-size: 12px;
    color: #555;
    line-height: 1.3;
  }
  </style>
</head>

<body>
  <div class="container">
    <div class="header"> <img src="images/popup_icon.png" id='logoImg'>
      <h1 class="text-center">              
              BetterKnightsUI
              </h1> </div>
    <div class="toggle_container">
      <div class="form-check form-switch">
        <input class="form-check-input" type="checkbox" id="toggleExtension" checked>
        <label class="form-check-label" for="flexSwitchCheckChecked" id="toggleExtensionLabel">Extension Enabled</label>
      </div>
    </div>
    <div class="export_container">
      <button type="button" id="popupCalendarExport" disabled aria-disabled="true">Export to calendar</button>
      <div id="popupCalendarExportHint">Open My Class Schedule (list view) to export.</div>
    </div>
    <div class="about_container">
      <h3 class="custom-header">About us</h3>
      <div id="disabled_site_separator" style=""></div>
      <p class="custom-paragraph"> 
        Tired of the outdated 2006 design on myUCF website? This extension makes it look cleaner, prettier, and easier to use
        <br><br>

        Works on <a href="https://my.ucf.edu" target="_blank" title='Student Self Service → Student Records → Enrollment → Add Classes → Search'>class search</a> and <a href="https://my.ucf.edu" target="_blank" title='Student Self Service → Student Center → Other Academics → Class Schedule (List view)'>My Class Schedule</a> (list view).
      </p>
    </div>
    <div class="credits">
      Made by <a href="https://github.com/DimChig" target="_blank">Dmytro</a>, <a href="https://github.com/diab-ma" target="_blank">Diab</a>, Anna, Santiago
    </div>
  </div>
</body>

</html>
